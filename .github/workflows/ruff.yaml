name: ruff

on: [push, pull_request]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup checkout
        uses: actions/checkout@master

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Lint with ruff
        run: uv run --only-group dev ruff check mwatershed tests
