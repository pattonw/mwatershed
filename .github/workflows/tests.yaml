name: tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    name: py${{ matrix.python-version }} ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    # Set once for the job: `uv run` re-syncs before it runs, so a mode passed
    # only to `uv sync` is undone by the tests step.
    env:
      UV_RESOLUTION: ${{ matrix.resolution }}
    strategy:
      fail-fast: false
      matrix:
        # requires-python floor and newest
        python-version: ["3.11", "3.14"]
        resolution: ["highest"]
        include:
          # the declared dependency floors, on the requires-python floor
          - python-version: "3.11"
            resolution: "lowest-direct"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
        if: matrix.resolution == 'highest'
      # lowest-direct resolves away from uv.lock by design, so no --locked
      - run: uv sync
        if: matrix.resolution == 'lowest-direct'
      - name: tests
        run: |
          start=$(date +%s%N)
          uv run pytest
          echo "PYTEST_SECONDS=$(awk "BEGIN {print ($(date +%s%N) - $start) / 1e9}")" >> "$GITHUB_ENV"
      # The benchmark workflow publishes these numbers after this run completes.
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.11' && matrix.resolution == 'highest'
        run: uv run python benchmarks/run.py --pytest-seconds "$PYTEST_SECONDS" --pytest-command "uv run pytest"
      - if: github.event_name != 'pull_request' && matrix.python-version == '3.11' && matrix.resolution == 'highest'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmarks/output.json
