name: docs
on:
  # Deploy on a version tag, so the site describes the released version.
  # Run by hand (workflow_dispatch) on a pull request's branch to check the
  # build before merging: that builds without deploying. A manual run on main
  # redeploys. Not run on every push or pull request commit.
  # Release order: push the version bump to main as the last commit, wait for
  # tests and benchmark to finish on it, then tag. The tag's deploy then
  # includes a benchmark point measured on the released commit.
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# One run at a time per ref; a running deploy is never cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
      - uses: pandoc/actions/setup@v1
      - run: uv sync --locked --group docs
      - run: uv run --group docs sphinx-build docs/source docs/build/html -b html
      # The benchmark action keeps its data and dashboard on gh-pages; the
      # site is deployed from this artifact, so bring them along.
      - run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null && git checkout origin/gh-pages -- dev/bench 2>/dev/null; then
            mkdir -p docs/build/html/dev && mv dev/bench docs/build/html/dev/
          fi
      # Only a tag or main deploys; a manual run on another branch is a build check.
      - if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html
  deploy:
    if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
