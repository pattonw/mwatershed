[build-system]
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
authors = [{ name = "William Patton", email = "wllmpttn24@gmail.com" }]
name = "mwatershed"
version = "0.6.1"
description = "A rusty mutex watershed"
readme = "README.md"

requires-python = ">=3.11"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: MIT License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]

dependencies = [
    "numpy>=1.18.0"
]

[dependency-groups]
# Installed by `uv sync` (PEP 735); not part of the published package.
# ruff is pinned with == until uv.lock is committed: it changes its rule
# set between releases.
dev = [
    "bump-my-version>=1.8",
    "maturin>=1.16",
    "pytest>=9",
    "pytest-cov>=6",
    "ruff==0.17.3",
    "ty==0.0.96",
]
docs = [
    "ipykernel>=6.29.5",
    "nbsphinx>=0.9.6",
    "sphinx>=8.2.3",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-material>=0.0.36",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=4.0",
    "jupytext>=1.16.7",
]

[tool.uv]
# Rebuild package when any rust files change
cache-keys = [{file = "pyproject.toml"}, {file = "Cargo.toml"}, {file = "**/*.rs"}]
# Uncomment to build rust code in development mode
# config-settings = { build-args = '--profile=dev' }
[tool.maturin]
# Generated evaluation outputs live in git for the report but are not shipped.
exclude = ["examples/linkage_eval/results.json", "examples/linkage_eval/*.png"]

[tool.ty.src]
include = ["mwatershed", "tests"]
exclude = []  # only ever shrinks

[tool.ruff]
line-length = 88
extend-exclude = ["docs/build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"tutorials/**/*.py" = ["E402"]  # jupytext cells import mid-file
"examples/**/*.py" = ["E402"]
"__init__.py" = ["F401"]  # re-exports

[tool.coverage.run]
branch = true
source = ["mwatershed"]

[tool.coverage.report]
# Floor measured from the first branch-enabled run; raise it when measured
# coverage is two or more points ahead, never lower it without saying why.
fail_under = 100
show_missing = true
skip_covered = true
