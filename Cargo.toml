[package]
name = "mwatershed"
version = "0.6.0"
edition = "2018"

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module"] }
numpy = "0.30"
ndarray = "0.17"
itertools = "0.15"
ordered-float = "5.5"
ndarray-rand = "0.16"
disjoint-sets = "0.4.2"

[dev-dependencies]
criterion = "0.8"
rand_isaac = "0.4"  # 0.5 moves to rand_core 0.10, which ndarray-rand 0.16 does not support yet

[lib]
name = "mwatershed"
crate-type = ["cdylib", "rlib"]

[[bench]]
name = "agglom"
harness = false
